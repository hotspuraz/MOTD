plugins {
    id 'java'
    id 'com.gradleup.shadow' version '8.3.5'
}

group = 'evo'
version = '1.0.0'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

repositories {
    mavenCentral()
    maven {
        name = 'papermc'
        url = 'https://repo.papermc.io/repository/maven-public/'
    }
}

dependencies {
    compileOnly 'com.velocitypowered:velocity-api:3.4.0-SNAPSHOT'
    annotationProcessor 'com.velocitypowered:velocity-api:3.4.0-SNAPSHOT'
    // Velocity ships no YAML parser, so it is bundled (and relocated) into the jar.
    implementation 'org.spongepowered:configurate-yaml:4.1.2'
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 21
}

processResources {
    filteringCharset = 'UTF-8'
}

tasks.named('shadowJar') {
    archiveBaseName = 'MOTD'
    archiveClassifier = ''
    relocate 'org.spongepowered.configurate', 'evo.motd.libs.configurate'
    relocate 'org.yaml.snakeyaml', 'evo.motd.libs.snakeyaml'
    relocate 'io.leangen.geantyref', 'evo.motd.libs.geantyref'
}

tasks.named('jar') {
    enabled = false
    dependsOn 'shadowJar'
}
